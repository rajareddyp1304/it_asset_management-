const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const money=n=>`₹${Number(n||0).toLocaleString("en-IN")}`;
let cache={settings:null,brands:null,categories:null,locations:null};
function toast(msg){const e=$("#toast");e.textContent=msg;e.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.remove("show"),2200)}
async function api(path,opt={}){const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}
async function getBrands(){if(Array.isArray(cache.brands))return cache.brands;const d=await api("/brands");const list=Array.isArray(d)?d:(d&&Array.isArray(d.brands)?d.brands:[]);cache.brands=list.filter(b=>b&&typeof b.name==="string");return cache.brands}
async function getLocations(){if(Array.isArray(cache.locations))return cache.locations;const d=await api("/locations");const list=Array.isArray(d)?d:(d&&Array.isArray(d.locations)?d.locations:[]);cache.locations=list.filter(x=>x&&typeof x.name==="string");return cache.locations}
async function getSettings(){return cache.settings||(cache.settings=await api("/settings"))}
function logo(white=false){return `<img src="/prh-logo-exact.png" alt="PRH Technologies"${white?' style="background:#fff;border-radius:8px;padding:4px"':''}>`}
function topbar(s){return `<div class="topbar"><div class="wrap"><span>📍 ${esc(s.city||"Bengaluru, Karnataka")}</span><div class="toplinks"><span>Pan-India Delivery</span><span>|</span><span>Genuine Products</span><span>|</span><span>Verified Quality</span><span>|</span><span>Best Prices</span><span>☎ ${esc(s.phone||"")}</span><span>💬 WhatsApp</span><span>✉ ${esc(s.email||"")}</span></div></div></div>`}

function footer(s){return `<footer class="footer"><div class="wrap"><div class="footerGrid"><div>${logo(true)}<p>${esc(s.tagline||"Quality Laptops at the Right Price")}</p><p>Quality laptops for students, professionals, businesses and everyday use.</p></div><div><h3>Quick Links</h3><a href="#/">Home</a><br><a href="#/browse">Browse Laptops</a><br><a href="#/favorites">Favorites</a><br><a href="#/about">About Us</a></div><div><h3>Customer Support</h3><a href="#/contact">Contact Us</a><br><a href="tel:${esc(s.phone||"")}">Call ${esc(s.phone||"")}</a><br><a href="https://wa.me/91${esc((s.whatsapp||s.phone||"").replace(/\D/g,''))}" target="_blank" rel="noopener">WhatsApp</a></div><div><h3>PRH Technologies</h3><p>${esc(s.email||"")}<br>${esc(s.city||"")}<br>${esc(s.delivery||"Pan-India delivery")}</p></div></div><div class="copyright"><span>© ${new Date().getFullYear()} PRH Technologies. All rights reserved.</span><span>Pan-India Delivery &nbsp;|&nbsp; Genuine Products &nbsp;|&nbsp; Verified Quality &nbsp;|&nbsp; Best Prices</span></div></div></footer>`}
function mobileMenu(){return `<div id="mobileNav" style="display:none;position:fixed;top:68px;left:10px;right:10px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:60;padding:8px"><a class="btn" style="width:100%;margin:3px 0" href="#/">Home</a><a class="btn" style="width:100%;margin:3px 0" href="#/browse">Laptops</a><a class="btn" style="width:100%;margin:3px 0" href="#/about">About Us</a><a class="btn" style="width:100%;margin:3px 0" href="#/contact">Contact Us</a><a class="btn" style="width:100%;margin:3px 0" href="#/favorites">Favorites</a></div>`}
function toggleMobile(){const e=$("#mobileNav");if(e)e.style.display=e.style.display==='none'?'block':'none'}
function brandMark(name){const n=name.toLowerCase();if(n==='dell')return '<span class="brandmark dell">DELL</span>';if(n==='hp')return '<span class="brandmark hp">hp</span>';if(n==='lenovo')return '<span class="brandmark lenovo">Lenovo</span>';if(n==='asus')return '<span class="brandmark asus">ASUS</span>';if(n==='acer')return '<span class="brandmark acer">acer</span>';if(n==='apple')return '<span class="brandmark apple">●</span>';if(n==='msi')return '<span class="brandmark msi">MSI</span>';if(n==='microsoft')return '<span class="brandmark ms"><i></i><i></i><i></i><i></i></span>';return `<span class="brandmark">${esc(name.slice(0,5))}</span>`}
function brandStrip(brands,xs=[]){const defaults=brands?.length?brands:[{name:'Dell'},{name:'HP'},{name:'Lenovo'},{name:'ASUS'},{name:'Acer'},{name:'Apple'},{name:'MSI'},{name:'Microsoft'}];const counts=(xs||[]).reduce((acc,x)=>{acc[x.brand]=(acc[x.brand]||0)+1;return acc},{});return `<div class="brandstrip"><div class="wrap"><div class="brandgrid">${defaults.slice(0,8).map(b=>`<a class="brandtile" href="#/browse?brand=${encodeURIComponent(b.name)}" title="View ${esc(b.name)} laptops">${brandMark(b.name)}<span>${esc(b.name)}</span><small class="brandCount">${counts[b.name]||0} available</small></a>`).join('')}<a class="brandtile" href="#/browse">▦<span>View All Brands</span></a></div></div></div>`}
function placeholder(){return '<div class="placeholderLaptop"></div>'}
function imageHtml(x,cls=""){return x.images?.[0]?`<img class="${cls}" src="${esc(x.images[0])}" alt="${esc(x.brand+' '+x.model)}" loading="lazy">`:placeholder()}
function favIds(){try{return JSON.parse(localStorage.getItem("prh_favs")||"[]")}catch{return[]}}
function isFav(id){return favIds().includes(id)}
function toggleFav(id){let a=favIds();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem("prh_favs",JSON.stringify(a));route()}
function favButton(x){return `<button class="fav ${isFav(x.listing_id)?'active':''}" onclick="event.preventDefault();event.stopPropagation();toggleFav('${esc(x.listing_id)}')">${isFav(x.listing_id)?'♥':'♡'}</button>`}
function productCard(x){return `<article class="productCard"><a href="#/laptop/${encodeURIComponent(x.listing_id)}">${favButton(x)}<div class="productImage">${imageHtml(x)}</div><div class="productBody"><span class="pill">${esc(x.label||'In Stock')}</span><h3>${esc(x.brand)} ${esc(x.model)}</h3><div class="specchips">${[x.processor,x.ram,x.storage,x.display].filter(Boolean).slice(0,4).map(v=>`<span class="specchip">${esc(v)}</span>`).join('')}</div><div class="price">${money(x.price)}</div><div class="meta">${esc(x.condition||'Condition not specified')} ${x.city?' • '+esc(x.city):''}</div><div class="productActions"><span class="btn primary">View Details</span><span class="btn green" onclick="event.preventDefault();window.open('https://wa.me/91'+('${esc((x.contact_number||'8123751594').replace(/\D/g,''))}'),'_blank')">WhatsApp</span></div></div></a></article>`}
function listCard(x){return `<article class="productCard"><a href="#/laptop/${encodeURIComponent(x.listing_id)}">${favButton(x)}<div class="productImage">${imageHtml(x)}</div><div class="productBody"><span class="pill">${esc(x.label||'In Stock')}</span><h3>${esc(x.brand)} ${esc(x.model)}</h3><div class="specchips">${[x.processor,x.ram,x.storage,x.display].filter(Boolean).slice(0,5).map(v=>`<span class="specchip">${esc(v)}</span>`).join('')}</div><div class="price">${money(x.price)}</div><div class="meta">${esc(x.condition||'')} ${x.city?' • '+esc(x.city):''}</div><div class="productActions"><span class="btn primary">View Details</span><span class="btn green">WhatsApp</span></div></div></a></article>`}
async function home(){const [s,brands,xs]=await Promise.all([getSettings(),getBrands(),api('/laptops')]);return `${customerNav('home',s)}${mobileMenu()}<main><section class="hero"><div class="wrap heroGrid"><div><div class="eyebrow">PRH TECHNOLOGIES</div><h1>Quality Laptops <span>at the Right Price</span></h1><p>Top brands, verified quality and clear specifications — making it easier to find a laptop that fits your work, study or business needs.</p><div class="searchWrap"><form class="searchbar" onsubmit="event.preventDefault();goSearch()"><span style="padding:12px 6px 12px 12px;font-size:19px">⌕</span><input id="homeSearch" autocomplete="off" placeholder="Search by brand, model or specification..." oninput="showSuggestions(this.value)"><button class="btn primary">Search</button></form><div id="suggestions" class="suggestions"></div></div><div class="heroTrust"><span>✓ Top Brands</span><span>✓ Verified Quality</span><span>✓ Pan-India Delivery</span></div></div><div class="heroLaptop"><div class="laptopArt"></div><div class="heroBenefits"><div class="benefit"><span class="benefitIcon">🚚</span><div><b>Pan-India Delivery</b><small>Safe & Reliable</small></div></div><div class="benefit"><span class="benefitIcon">🛡</span><div><b>Verified Laptops</b><small>Quality Checked</small></div></div><div class="benefit"><span class="benefitIcon">🏷</span><div><b>Best Prices</b><small>Great Deals</small></div></div><div class="benefit"><span class="benefitIcon">☎</span><div><b>Quick Support</b><small>Call or WhatsApp</small></div></div></div></div></div></section>${brandStrip(brands,xs)}<section class="section"><div class="wrap"><div class="sectionHead"><div><h2>Latest Laptops</h2><p>Browse currently available laptops from PRH Technologies.</p></div><a class="btn primary" href="#/browse">View All Laptops →</a></div>${xs.length?`<div class="productGrid">${xs.slice(0,6).map(productCard).join('')}</div>`:`<div class="empty"><h2>No laptops published yet</h2><p>The owner can add and publish laptops from the Admin Dashboard.</p><a class="btn primary" href="#/admin-login">Admin Login</a></div>`}</div></section><section class="section" style="background:#f7faff"><div class="wrap"><div class="infoGrid"><div class="infoCard panel"><h2>Why Choose PRH Technologies?</h2><ul class="why"><li>Quality laptops at the right price</li><li>Clear specifications before you contact us</li><li>Verified and quality checked products</li><li>Pan-India delivery support</li><li>Friendly phone and WhatsApp support</li></ul></div><div class="infoCard panel"><h2>Need Help?</h2><div class="contactLine"><span>☎</span><div><b>Call Us</b><span>${esc(s.phone||'')}</span></div></div><div class="contactLine"><span>💬</span><div><b>WhatsApp</b><span>${esc(s.whatsapp||s.phone||'')}</span></div></div><div class="contactLine"><span>✉</span><div><b>Email Us</b><span>${esc(s.email||'')}</span></div></div><a class="btn primary" href="#/contact">Contact PRH Technologies</a></div></div></div></section></main>${footer(s)}`}
async function showSuggestions(q){const box=$("#suggestions");if(!box)return;if(!q||q.trim().length<2){box.style.display='none';return}try{const xs=await api('/laptops?q='+encodeURIComponent(q.trim()));const vals=[...new Set(xs.slice(0,6).map(x=>`${x.brand} ${x.model}`))];box.innerHTML=vals.length?vals.map(v=>`<button onclick="location.hash='#/browse?q='+encodeURIComponent('${esc(v).replace(/'/g,"\\'")}')">⌕ ${esc(v)}</button>`).join(''):'<button disabled>No matching laptops</button>';box.style.display='block'}catch{box.style.display='none'}}
function goSearch(){const q=$("#homeSearch")?.value.trim();location.hash='#/browse'+(q?'?q='+encodeURIComponent(q):'')}
async function browse(){const s=await getSettings();const [brands,locations]=await Promise.all([getBrands(),getLocations()]);const p=new URLSearchParams(location.hash.split('?')[1]||'');let q=p.get('q')||'',brand=p.get('brand')||'',minPrice=p.get('minPrice')||'',maxPrice=p.get('maxPrice')||'',ram=p.get('ram')||'',storage=p.get('storage')||'',graphics=p.get('graphics')||'',condition=p.get('condition')||'',city=p.get('city')||'',sort=p.get('sort')||'newest';let qs=new URLSearchParams({q,brand,minPrice,maxPrice,ram,storage,graphics,condition,city,sort});let xs=await api('/laptops?'+qs.toString());const checked=(v,x)=>v===x?'checked':'';return `${customerNav('browse',s)}${mobileMenu()}<main><div class="pageHero"><div class="wrap"><h1>Browse Laptops</h1><p>Search across brands, models, specifications and descriptions. Filters work together so every selected condition is applied.</p><div class="searchbar" style="max-width:900px"><span style="padding:12px 6px 12px 12px;font-size:19px">⌕</span><input id="browseSearch" value="${esc(q)}" placeholder="Search brand, model, processor, RAM, storage, graphics..."><button class="btn primary" onclick="applyBrowseSearch()">Search</button></div></div></div><section class="section"><div class="wrap browseLayout"><aside class="panel filterPanel"><div class="filterHead"><span>Filters</span><button class="btn small" onclick="clearFilters()">Clear All</button></div><div class="filterGroup"><div class="filterTitle">Brand</div>${brands.map(b=>`<label><input type="radio" name="brand" value="${esc(b.name)}" ${checked(brand,b.name)} onchange="filterChange()">${esc(b.name)}</label>`).join('')}</div><div class="filterGroup"><div class="filterTitle">Price Range</div><div class="priceInputs"><input id="minPrice" type="number" placeholder="Min" value="${esc(minPrice)}"><input id="maxPrice" type="number" placeholder="Max" value="${esc(maxPrice)}"></div><button class="btn small" style="width:100%;margin-top:7px" onclick="filterChange()">Apply Price</button></div><div class="filterGroup"><div class="filterTitle">RAM</div>${['4GB','8GB','16GB','32GB'].map(v=>`<label><input type="radio" name="ram" value="${v}" ${checked(ram,v)} onchange="filterChange()">${v}</label>`).join('')}</div><div class="filterGroup"><div class="filterTitle">Storage</div>${['256GB SSD','512GB SSD','1TB SSD','1TB HDD'].map(v=>`<label><input type="radio" name="storage" value="${v}" ${checked(storage,v)} onchange="filterChange()">${v}</label>`).join('')}</div><div class="filterGroup"><div class="filterTitle">Condition</div>${['Excellent','Good','Used','Refurbished'].map(v=>`<label><input type="radio" name="condition" value="${v}" ${checked(condition,v)} onchange="filterChange()">${v}</label>`).join('')}</div><div class="filterGroup"><div class="filterTitle">Location</div>${locations.map(v=>`<label><input type="radio" name="city" value="${esc(v.name)}" ${checked(city,v.name)} onchange="filterChange()">${esc(v.name)}</label>`).join('')}</div></aside><div class="productsPanel"><div class="resultsbar"><strong>${xs.length} Laptops Found</strong><div class="sortbox"><span style="font-size:12px;color:var(--muted)">Sort by:</span><select id="sort" onchange="filterChange()"><option value="newest" ${sort==='newest'?'selected':''}>Newest First</option><option value="price_asc" ${sort==='price_asc'?'selected':''}>Price Low → High</option><option value="price_desc" ${sort==='price_desc'?'selected':''}>Price High → Low</option><option value="name" ${sort==='name'?'selected':''}>Brand / Model</option></select><div class="viewToggle"><button class="active" onclick="setView('grid')">▦ Grid</button><button onclick="setView('list')">☷ List</button></div></div></div><div id="productResults" class="productGrid">${xs.length?xs.map(productCard).join(''):`<div class="empty" style="grid-column:1/-1"><h2>No matching laptops</h2><p>Try clearing one or more filters or changing the search.</p><button class="btn primary" onclick="clearFilters()">Clear All Filters</button></div>`}</div></div><aside class="sideStack"><div class="panel sideCard"><h3>Need Help?</h3><div class="contactLine"><span>☎</span><div><b>Call Us</b><span>${esc(s.phone||'')}</span></div></div><div class="contactLine"><span>💬</span><div><b>WhatsApp</b><span>${esc(s.whatsapp||s.phone||'')}</span></div></div><div class="contactLine"><span>✉</span><div><b>Email Us</b><span>${esc(s.email||'')}</span></div></div><div class="contactLine"><span>📍</span><div><b>Our Location</b><span>${esc(s.city||'')}</span></div></div></div><div class="panel sideCard"><h3>Why Choose PRH Technologies?</h3><ul class="why"><li>Quality Laptops at the Right Price</li><li>Verified and Quality Checked</li><li>Pan-India Delivery</li><li>Top Brands Available</li><li>Friendly Support via Call/WhatsApp</li><li>Bengaluru Based</li></ul></div><div class="panel sideCard deliveryCard"><div class="deliveryTruck">🚚</div><h3>Pan-India Delivery</h3><p style="font-size:11px;color:var(--muted)">Safe · Reliable · Fast</p><a class="btn primary" href="#/contact" style="width:100%">Learn More</a></div></aside></div></section></main>${footer(s)}`}
function selectedRadio(name){return document.querySelector(`input[name="${name}"]:checked`)?.value||''}
function filterChange(){const p=new URLSearchParams(location.hash.split('?')[1]||'');const fields={brand:selectedRadio('brand'),ram:selectedRadio('ram'),storage:selectedRadio('storage'),condition:selectedRadio('condition'),city:selectedRadio('city'),sort:$("#sort")?.value||'newest',minPrice:$("#minPrice")?.value||'',maxPrice:$("#maxPrice")?.value||'',q:$("#browseSearch")?.value.trim()||p.get('q')||''};const q=new URLSearchParams();Object.entries(fields).forEach(([k,v])=>{if(v)q.set(k,v)});location.hash='#/browse?'+q.toString()}
function applyBrowseSearch(){filterChange()}
function clearFilters(){location.hash='#/browse'}
function setView(v){document.querySelector('.productsPanel')?.classList.toggle('listView',v==='list');document.querySelectorAll('.viewToggle button').forEach((b,i)=>b.classList.toggle('active',(v==='grid'&&i===0)||(v==='list'&&i===1)))}
async function detail(id){const [s,x]=await Promise.all([getSettings(),api('/laptops/'+encodeURIComponent(id))]);const imgs=x.images||[];return `${customerNav('browse',s)}${mobileMenu()}<main><div class="section"><div class="wrap"><div class="detailLayout"><div class="panel galleryPanel"><div class="galleryMain" id="galleryMain">${imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(x.brand+' '+x.model)}">`:placeholder()}</div>${imgs.length?`<div class="galleryThumbs">${imgs.map((im,i)=>`<button onclick="changeGallery('${esc(im)}')"><img src="${esc(im)}" alt=""></button>`).join('')}</div>`:''}</div><div class="panel detailInfo"><span class="pill">${esc(x.label||'In Stock')}</span><h1>${esc(x.brand)} ${esc(x.model)}</h1><div style="color:var(--muted);font-size:11px">Listing ID: ${esc(x.listing_id)} ${x.city?' • '+esc(x.city):''}</div><div class="detailPrice">${money(x.price)} ${x.negotiable?'<span style="font-size:11px;color:#07834d;font-weight:800">Price Negotiable</span>':''}</div><p class="detailDesc">${esc(x.description||'Quality checked laptop available from PRH Technologies. Contact us for current availability and delivery details.')}</p><div class="detailGrid">${[['Brand',x.brand],['Model',x.model],['Processor',x.processor],['RAM',x.ram],['Storage',x.storage],['Graphics',x.graphics],['Display',x.display],['Battery',x.battery],['Purchase Year',x.purchase_year],['Condition',x.condition],['Location',x.city]].filter(a=>a[1]).map(a=>`<div class="detailRow"><b>${esc(a[0])}</b>${esc(a[1])}</div>`).join('')}</div><div class="bigContact"><a class="btn primary" href="tel:${esc(x.contact_number||s.phone||'')}">☎ Call ${esc(x.contact_number||s.phone||'')}</a><a class="btn green" target="_blank" rel="noopener" href="https://wa.me/91${esc((x.contact_number||s.whatsapp||s.phone||'').replace(/\D/g,''))}">💬 WhatsApp</a></div></div></div></div></div></main>${footer(s)}`}
function changeGallery(src){const e=$("#galleryMain");if(e)e.innerHTML=`<img src="${esc(src)}" alt="Laptop photo">`}
async function favorites(){const s=await getSettings();const ids=favIds();let xs=[];for(const id of ids){try{xs.push(await api('/laptops/'+encodeURIComponent(id)))}catch{}}return `${customerNav('browse',s)}${mobileMenu()}<main><div class="pageHero"><div class="wrap"><h1>Favorites</h1><p>Your saved laptops are stored in this browser. No customer account is required.</p></div></div><section class="section"><div class="wrap">${xs.length?`<div class="productGrid">${xs.map(productCard).join('')}</div>`:`<div class="empty"><div style="font-size:48px">♡</div><h2>No favorites yet</h2><p>Tap the heart on any laptop to save it here.</p><a class="btn primary" href="#/browse">Browse Laptops</a></div>`}</div></section></main>${footer(s)}`}

async function login(){const s=await getSettings();return `${topbar(s)}<main class="loginPage"><div class="loginCard"><div class="loginVisual">${logo(true)}<h2>Owner Admin</h2><p>Manage the PRH Technologies laptop catalogue from one secure dashboard.</p><ul class="loginList"><li>Add and edit laptop listings</li><li>Upload up to 10 product photos</li><li>Manage brands, categories and locations</li><li>Track activity and notifications</li><li>Update website settings</li></ul></div><form class="loginForm" onsubmit="doLogin(event)"><h1>Admin Login</h1><p>Authorized PRH Technologies administrators only.</p><div class="field"><label>Email Address</label><input id="loginEmail" type="email" required autocomplete="username" placeholder="owner@prhtechnologies.com"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Enter your password"></div><button class="btn primary" style="width:100%;margin-top:8px">Login</button><p style="text-align:center;margin-top:13px;font-size:10px">🔒 Secure Admin Access</p></form></div></main>`}
async function doLogin(e){e.preventDefault();try{await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#loginEmail').value,password:$('#loginPassword').value})});location.hash='#/admin'}catch(err){toast(err.message)}}
function adminNav(active){const items=[['admin','▦','Dashboard'],['admin/laptops','▤','Manage Laptops'],['admin/add','＋','Add Laptop'],['admin/brands','◉','Brands'],['admin/categories','◫','Categories'],['admin/locations','⌖','Locations'],['admin/users','♙','Admin Users'],['admin/activity','◷','Activity Log'],['admin/notifications','●','Notifications'],['admin/settings','⚙','Website Settings']];return `<aside class="adminSide" id="adminSide"><div class="adminBrand"><img src="/prh-logo-exact.png"><div><b>PRH Technologies</b><small>Owner Administration</small></div></div><nav class="adminMenu">${items.map(x=>`<a class="${active===x[0]?'active':''}" href="#/${x[0]}"><span>${x[1]}</span>${x[2]}</a>`).join('')}<a href="#/" style="margin-top:12px">↗ View Customer Website</a><a href="#" onclick="doLogout();return false">⇥ Logout</a></nav></aside>`}
async function adminShell(active,title,body){const me=await api('/auth/me');return `<div class="adminShell">${adminNav(active)}<section class="adminMain"><div class="adminTop"><div><h1>${esc(title)}</h1><span style="font-size:11px;color:var(--muted)">Signed in as ${esc(me.name)} · ${esc(me.email)}</span></div><button class="iconbtn mobileMenu" onclick="document.querySelector('#adminSide').classList.toggle('open')">☰</button></div>${body}</section></div>`}
async function admin(){const st=await api('/admin/stats'),xs=await api('/admin/laptops');const recent=xs.slice(0,6);return adminShell('admin','Dashboard',`<div class="stats"><div class="statCard"><small>Total Laptops</small><strong>${st.total}</strong></div><div class="statCard"><small>Published</small><strong style="color:#0a9b61">${st.published}</strong></div><div class="statCard"><small>Drafts</small><strong style="color:#b77800">${st.drafts}</strong></div><div class="statCard"><small>Out of Stock</small><strong style="color:#d53b43">${st.outOfStock}</strong></div></div><div class="adminGrid"><div class="adminCard"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Recently Added</h2><a class="btn primary small" href="#/admin/add">＋ Add Laptop</a></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>ID</th><th>Laptop</th><th>Brand</th><th>Price</th><th>Status</th></tr></thead><tbody>${recent.map(x=>`<tr><td>${esc(x.listing_id)}</td><td>${esc(x.model)}</td><td>${esc(x.brand)}</td><td>${money(x.price)}</td><td><span class="status ${x.status==='Published'?'published':x.status==='Draft'?'draft':'out'}">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5">No laptops yet.</td></tr>'}</tbody></table></div></div><div class="adminCard"><h2>Quick Actions</h2><a class="btn primary" style="width:100%;margin-bottom:8px" href="#/admin/add">＋ Add New Laptop</a><a class="btn" style="width:100%;margin-bottom:8px" href="#/admin/laptops">Manage Listings</a><a class="btn" style="width:100%;margin-bottom:8px" href="#/admin/brands">Manage Brands</a><a class="btn" style="width:100%" href="#/admin/settings">Website Settings</a></div></div>`)}
async function manage(){const xs=await api('/admin/laptops');return adminShell('admin/laptops','Manage Laptops',`<div class="adminCard"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0">All Listings</h2><a class="btn primary" href="#/admin/add">＋ Add Laptop</a></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>ID</th><th>Laptop</th><th>Price</th><th>City</th><th>Status</th><th>Actions</th></tr></thead><tbody>${xs.map(x=>`<tr><td>${esc(x.listing_id)}</td><td><b>${esc(x.brand)} ${esc(x.model)}</b></td><td>${money(x.price)}</td><td>${esc(x.city||'')}</td><td><span class="status ${x.status==='Published'?'published':x.status==='Draft'?'draft':'out'}">${esc(x.status)}</span></td><td><a class="btn small" href="#/admin/edit/${encodeURIComponent(x.listing_id)}">Edit</a> <button class="btn small danger" onclick="deleteLaptop('${esc(x.listing_id)}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No listings yet.</td></tr>'}</tbody></table></div></div>`)}
function inputField(name,label,value='',type='text',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`}
function brandMark(name){const n=String(name||'').toLowerCase();if(n==='dell')return '<span class="brandmark dell">DELL</span>';if(n==='hp')return '<span class="brandmark hp">hp</span>';if(n==='lenovo')return '<span class="brandmark lenovo">Lenovo</span>';if(n==='asus')return '<span class="brandmark asus">ASUS</span>';if(n==='acer')return '<span class="brandmark acer">acer</span>';if(n==='apple')return '<span class="brandmark apple">●</span>';if(n==='msi')return '<span class="brandmark msi">MSI</span>';if(n==='microsoft')return '<span class="brandmark ms"><i></i><i></i><i></i><i></i></span>';return '<span class="brandmark">'+esc(String(name||'').slice(0,3).toUpperCase())+'</span>'}
function selectBrand(el){document.querySelectorAll('.brandChoice').forEach(x=>x.classList.remove('active'));el.classList.add('active');const input=$('#selectedBrand');if(input)input.value=el.dataset.brand||''}
function selectStatus(el){document.querySelectorAll('.statusChoice').forEach(x=>x.classList.remove('active'));el.classList.add('active');const input=$('#selectedStatus');if(input)input.value=el.dataset.status||'Draft'}
async function laptopForm(id){let x={};if(id){const rows=await api('/admin/laptops');x=(Array.isArray(rows)?rows:[]).find(v=>v.listing_id===id)||{};}const brandsRaw=await getBrands();const locationsRaw=await getLocations();const brands=Array.isArray(brandsRaw)?brandsRaw:[];const locations=Array.isArray(locationsRaw)?locationsRaw:[];const currentBrand=String(x.brand||'').toLowerCase();const currentStatus=x.status||'Draft';return adminShell(id?'admin/laptops':'admin/add',id?'Edit Laptop':'Add New Laptop',`<form class="adminForm" id="laptopForm" enctype="multipart/form-data"><div class="formGrid"><div class="field full"><label>Choose Brand</label><input id="selectedBrand" type="hidden" name="brand" value="${esc(x.brand||'')}" required><div class="brandPicker">${brands.map(b=>`<button type="button" class="brandChoice ${String(b.name).toLowerCase()===currentBrand?'active':''}" data-brand="${esc(b.name)}" onclick="selectBrand(this)">${brandMark(b.name)}<span>${esc(b.name)}</span></button>`).join('')}</div><div class="formHint">Select the actual laptop brand while creating the listing. This connects the laptop to that brand logo on the customer website.</div></div>${inputField('model','Model Name',x.model||'')}${inputField('price','Price (₹)',x.price||'', 'number')}${inputField('processor','Processor',x.processor||'')}${inputField('ram','RAM',x.ram||'')}${inputField('storage','Storage',x.storage||'')}${inputField('graphics','Graphics',x.graphics||'')}${inputField('display','Display',x.display||'')}${inputField('battery','Battery',x.battery||'')}${inputField('purchase_year','Purchase Year',x.purchase_year||'', 'number')}${inputField('condition','Condition',x.condition||'')}${inputField('city','Location / City',x.city||'')}${inputField('label','Product Label',x.label||'In Stock')}${inputField('contact_number','Contact Number',x.contact_number||'8123751594')}<div class="field full"><label>Description</label><textarea name="description">${esc(x.description||'')}</textarea></div><div class="field full"><label>Listing Status</label><input id="selectedStatus" type="hidden" name="status" value="${esc(currentStatus)}"><div class="statusPicker"><button type="button" class="statusChoice ${currentStatus==='Draft'?'active':''}" data-status="Draft" onclick="selectStatus(this)"><b><span class="statusDot"></span>Draft</b><small>Save privately. Customers cannot see this laptop.</small></button><button type="button" class="statusChoice ${currentStatus==='Published'?'active':''}" data-status="Published" onclick="selectStatus(this)"><b><span class="statusDot published"></span>Published</b><small>Available to customers and shown in search/brand listings.</small></button><button type="button" class="statusChoice ${currentStatus==='Out of Stock'?'active':''}" data-status="Out of Stock" onclick="selectStatus(this)"><b><span class="statusDot out"></span>Out of Stock</b><small>Keep the record in admin, but hide it from customers.</small></button></div></div><div class="field" style="display:flex;align-items:end"><label class="checkline"><input type="checkbox" name="negotiable" ${x.negotiable?'checked':''}> Price Negotiable</label></div><div class="field full"><label>Upload Photos — up to 10 images, max 8MB each</label><div class="uploadBox">📷<br><b>Select laptop photos</b><br><small>JPG, PNG or WebP</small><input style="margin-top:12px" type="file" name="photos" multiple accept="image/jpeg,image/png,image/webp"></div>${id&&x.images?.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;margin-top:10px">${x.images.map((im,i)=>`<div class="panel" style="padding:7px;text-align:center"><div style="height:90px;background:#f6f8fb;border-radius:7px;display:flex;align-items:center;justify-content:center"><img src="${esc(im)}" style="max-width:100%;max-height:100%;object-fit:contain"></div><small style="display:block;margin:6px 0;font-weight:800">${i===0?'Cover Photo':'Photo '+(i+1)}</small><div style="display:flex;gap:3px"><button type="button" class="btn small" onclick="movePhoto('${esc(id)}',${i},-1)">←</button><button type="button" class="btn small" onclick="movePhoto('${esc(id)}',${i},1)">→</button><button type="button" class="btn small danger" onclick="removePhoto('${esc(id)}',${x.image_ids?.[i]||''})">×</button></div></div>`).join('')}</div>`:''}</div></div><div class="formActions"><button class="btn primary">${id?'Save Changes':'Create Laptop'}</button><a class="btn" href="#/admin/laptops">Cancel</a></div></form>`)}

async function submitLaptop(e){e.preventDefault();const id=location.hash.startsWith('#/admin/edit/')?decodeURIComponent(location.hash.split('/')[3]):'';const fd=new FormData(e.target);try{await api('/admin/laptops'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body:fd});toast(id?'Laptop updated':'Laptop created');setTimeout(()=>location.hash='#/admin/laptops',500)}catch(err){toast(err.message)}}
async function taxPage(type,title){const xs=await api('/admin/'+type);return adminShell('admin/'+type,title,`<div class="adminCard"><div style="display:flex;gap:8px;margin-bottom:14px"><input id="taxName" placeholder="New name" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:10px"><button class="btn primary" onclick="addTax('${type}')">＋ Add</button></div><div class="tableWrap"><table class="dataTable"><thead><tr><th>ID</th><th>Name</th><th>Action</th></tr></thead><tbody>${xs.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td><button class="btn small danger" onclick="deleteTax('${type}',${x.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`)}
async function addTax(type){const n=$("#taxName")?.value.trim();if(!n)return toast('Enter a name');try{await api('/admin/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});route()}catch(e){toast(e.message)}}
async function deleteTax(type,id){if(!confirm('Delete this item?'))return;try{await api('/admin/'+type+'/'+id,{method:'DELETE'});route()}catch(e){toast(e.message)}}
async function users(){const xs=await api('/admin/users');return adminShell('admin/users','Admin Users',`<div class="adminGrid"><div class="adminCard"><h2>Create Admin</h2><form onsubmit="addAdmin(event)"><div class="formGrid"><div class="field"><label>Name</label><input id="newAdminName" required></div><div class="field"><label>Email</label><input id="newAdminEmail" type="email" required></div><div class="field full"><label>Temporary Password</label><input id="newAdminPassword" type="password" required minlength="8"></div></div><button class="btn primary" style="margin-top:14px">Create Admin</button></form></div><div class="adminCard"><h2>Existing Admins</h2><div class="tableWrap"><table class="dataTable"><thead><tr><th>Name</th><th>Email</th><th>Created</th><th></th></tr></thead><tbody>${xs.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.created_at)}</td><td><button class="btn small danger" onclick="deleteAdmin(${x.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div></div>`)}
async function addAdmin(e){e.preventDefault();try{await api('/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#newAdminName').value,email:$('#newAdminEmail').value,password:$('#newAdminPassword').value})});toast('Admin created');route()}catch(err){toast(err.message)}}
async function deleteAdmin(id){if(!confirm('Delete this admin account?'))return;try{await api('/admin/users/'+id,{method:'DELETE'});route()}catch(e){toast(e.message)}}
async function activity(){const xs=await api('/admin/activity');return adminShell('admin/activity','Activity Log',`<div class="adminCard"><div class="tableWrap"><table class="dataTable"><thead><tr><th>Action</th><th>Admin</th><th>Details</th><th>Time</th></tr></thead><tbody>${xs.map(x=>`<tr><td>${esc(x.action)}</td><td>${esc(x.admin_name||'')}</td><td>${esc(x.details||'')}</td><td>${esc(x.created_at)}</td></tr>`).join('')}</tbody></table></div></div>`)}
async function notifications(){const xs=await api('/admin/notifications');return adminShell('admin/notifications','Notifications',`<div class="adminCard"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><h2>Notification History</h2><button class="btn" onclick="readAll()">Mark All Read</button></div><div style="display:grid;gap:8px">${xs.map(x=>`<div class="panel" style="padding:13px;background:${x.is_read?'#fff':'#f2f8ff'}"><b>${esc(x.title)}</b><p style="font-size:12px;color:var(--muted);margin:5px 0">${esc(x.message)}</p><small style="color:#8293a8">${esc(x.created_at)} · ${x.is_read?'Read':'Unread'}</small></div>`).join('')||'<div class="empty">No notifications.</div>'}</div></div>`)}
async function readAll(){await api('/admin/notifications/read-all',{method:'POST'});route()}
async function settingsAdmin(){const s=await api('/admin/settings');const fields=Object.entries(s).map(([k,v])=>`<div class="field"><label>${esc(k.replaceAll('_',' '))}</label><input name="${esc(k)}" value="${esc(v)}"></div>`).join('');return adminShell('admin/settings','Website Settings',`<form class="adminForm" id="settingsForm"><div class="formGrid">${fields}</div><div class="formActions"><button class="btn primary">Save Settings</button></div></form>`)}
async function submitSettings(e){e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=v);try{await api('/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});cache.settings=null;toast('Settings saved')}catch(e){toast(e.message)}}
async function deleteLaptop(id){if(!confirm('Delete this laptop permanently?'))return;try{await api('/admin/laptops/'+encodeURIComponent(id),{method:'DELETE'});toast('Laptop deleted');route()}catch(e){toast(e.message)}}
async function movePhoto(id,index,delta){try{const xs=await api('/admin/laptops');const x=xs.find(v=>v.listing_id===id);if(!x||!Array.isArray(x.image_ids))return;const ni=index+delta;if(ni<0||ni>=x.image_ids.length)return;const ids=[...x.image_ids];[ids[index],ids[ni]]=[ids[ni],ids[index]];await api('/admin/laptops/'+encodeURIComponent(id)+'/images/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageIds:ids})});route()}catch(e){toast(e.message)}}
async function removePhoto(id,imageId){if(!imageId)return;if(!confirm('Remove this photo?'))return;try{await api('/admin/laptops/'+encodeURIComponent(id)+'/images/'+encodeURIComponent(imageId),{method:'DELETE'});route()}catch(e){toast(e.message)}}
async function doLogout(){await api('/auth/logout',{method:'POST'});location.hash='#/'}
async function guardAdmin(){try{await api('/auth/me');return true}catch{location.hash='#/admin-login';return false}}
async function route(){const h=location.hash||'#/';const app=$('#app');try{if(h==='#/')app.innerHTML=await home();else if(h.startsWith('#/browse'))app.innerHTML=await browse();else if(h.startsWith('#/laptop/'))app.innerHTML=await detail(decodeURIComponent(h.split('/')[2]));else if(h==='#/favorites')app.innerHTML=await favorites();else if(h==='#/about')app.innerHTML=await about();else if(h==='#/contact')app.innerHTML=await contact();else if(h==='#/admin-login')app.innerHTML=await login();else if(h==='#/admin'&&await guardAdmin())app.innerHTML=await admin();else if(h==='#/admin/laptops'&&await guardAdmin())app.innerHTML=await manage();else if(h==='#/admin/add'&&await guardAdmin())app.innerHTML=await laptopForm();else if(h.startsWith('#/admin/edit/')&&await guardAdmin())app.innerHTML=await laptopForm(decodeURIComponent(h.split('/')[3]));else if(h==='#/admin/brands'&&await guardAdmin())app.innerHTML=await taxPage('brands','Manage Brands');else if(h==='#/admin/categories'&&await guardAdmin())app.innerHTML=await taxPage('categories','Manage Categories');else if(h==='#/admin/locations'&&await guardAdmin())app.innerHTML=await taxPage('locations','Manage Locations');else if(h==='#/admin/users'&&await guardAdmin())app.innerHTML=await users();else if(h==='#/admin/activity'&&await guardAdmin())app.innerHTML=await activity();else if(h==='#/admin/notifications'&&await guardAdmin())app.innerHTML=await notifications();else if(h==='#/admin/settings'&&await guardAdmin())app.innerHTML=await settingsAdmin();else app.innerHTML=notFound();window.scrollTo(0,0)}catch(err){console.error(err);app.innerHTML=`<main class="notfound"><div><h1>!</h1><h2>Something went wrong</h2><p>${esc(err.message)}</p><a class="btn primary" href="#/">Go Home</a></div></main>`}}
function notFound(){return `<main class="notfound"><div><h1>404</h1><h2>Page Not Found</h2><p>The page you requested does not exist or is no longer available.</p><a class="btn primary" href="#/">Go to Homepage</a></div></main>`}
document.addEventListener('submit',e=>{if(e.target.id==='laptopForm')submitLaptop(e);if(e.target.id==='settingsForm')submitSettings(e)});
window.addEventListener('hashchange',route);window.addEventListener('click',e=>{if(!e.target.closest('.searchWrap')){const s=$('#suggestions');if(s)s.style.display='none'}});route();
</script>
</body>
</html>
