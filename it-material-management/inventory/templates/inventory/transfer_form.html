<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transfer Asset</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 18px 30px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
        }

        button,
        .back {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        button {
            background: #2563eb;
        }

        .back {
            background: #6b7280;
            margin-left: 8px;
        }

        .errorlist {
            color: #dc2626;
            margin: 5px 0;
            padding-left: 20px;
        }
    </style>
</head>

<body>

<div class="header">
    IT Material Management
</div>

<div class="container">

    <div class="card">

        <h2>Transfer Asset</h2>

        <form method="post">

            {% csrf_token %}

            {% for field in form %}

                <div class="form-group">

                    {{ field.label_tag }}

                    {{ field }}

                    {% if field.errors %}
                        {{ field.errors }}
                    {% endif %}

                </div>

            {% endfor %}

            <div class="buttons">

                <button type="submit">
                    Transfer Asset
                </button>

                <a
                    href="{% url 'transfer_list' %}"
                    class="back"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
